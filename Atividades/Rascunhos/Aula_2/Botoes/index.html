<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de Botões e Formulários</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <form class="form-container">
    <h2>Fale conosco</h2>

    <div id="mensagem-status"> </div>
    
    <div class="form-group">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Digite seu email">
    </div>
    <div class="form-group">
      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Estilização"></textarea>
    </div>
    <div class="button-group">
      <button type="submit" class="btn btn-principal">Enviar</button>
      <button type="reset" class="btn btn-decorativo">Limpar</button>
    </div>
  </form>

<script src="/Rascunhos/Aula_4/script.js" defer></script>

</body>
</html>
